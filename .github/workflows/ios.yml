name: Build iPhone IPA
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned app for physical iPhone
        run: >-
          xcodebuild -project UniversalCamPhone.xcodeproj
          -scheme UniversalCamPhone -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for SideStore
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/UniversalCam.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/UniversalCam-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalCam-SideStore
          path: ${{ runner.temp }}/UniversalCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
